name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Generate Android project and native app wiring
        run: |
          flutter create --platforms=android --org ir.cybermatrix --project-name cybermatrix_tunnel .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="cybermatrix_tunnel"', 'android:label="سایبرماتریکس تونل"')
          text = text.replace('<application', '<application\n        android:name=".MyApplication"\n        android:usesCleartextTraffic="true"', 1)
          manifest.write_text(text)

          app = Path('android/app/src/main/kotlin/ir/cybermatrix/cybermatrix_tunnel/MyApplication.kt')
          app.parent.mkdir(parents=True, exist_ok=True)
          app.write_text('''package ir.cybermatrix.cybermatrix_tunnel

          import android.app.Application
          import com.tencent.mmkv.MMKV

          class MyApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  MMKV.initialize(this)
              }
          }
          ''')
          PY

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybermatrix-tunnel-real-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
