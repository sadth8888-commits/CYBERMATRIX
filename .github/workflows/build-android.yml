name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cybermatrix-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org ir.cybermatrix --project-name cybermatrix_tunnel .
          rm -f test/widget_test.dart

      - name: Apply CyberMatrix VPN runtime fix
        run: python3 scripts/patch_vpn_runtime.py

      - name: Configure Android project
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          application = root.find("application")
          if application is None:
              raise RuntimeError("application node not found")

          camera_permission = "android.permission.CAMERA"
          if not any(
              item.get(f"{{{android_ns}}}name") == camera_permission
              for item in root.findall("uses-permission")
          ):
              permission = ET.Element("uses-permission")
              permission.set(f"{{{android_ns}}}name", camera_permission)
              root.insert(0, permission)

          application.set(f"{{{android_ns}}}label", "سایبرماتریکس تونل")
          application.set(f"{{{android_ns}}}name", ".MyApplication")
          application.set(f"{{{android_ns}}}usesCleartextTraffic", "true")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          ET.parse(manifest)

          app = Path("android/app/src/main/kotlin/ir/cybermatrix/cybermatrix_tunnel/MyApplication.kt")
          app.parent.mkdir(parents=True, exist_ok=True)
          app.write_text(
              "package ir.cybermatrix.cybermatrix_tunnel\n\n"
              "import android.app.Application\n"
              "import com.tencent.mmkv.MMKV\n\n"
              "class MyApplication : Application() {\n"
              "    override fun onCreate() {\n"
              "        super.onCreate()\n"
              "        MMKV.initialize(this)\n"
              "    }\n"
              "}\n"
          )

          app_gradle = Path("android/app/build.gradle.kts")
          text = app_gradle.read_text()
          text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
          text = text.replace("minSdk = flutter.minSdkVersion", "minSdk = 26")
          text = text.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
          text = text.replace(
              "sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17",
              "sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true",
          )

          dep_marker = "coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")"
          if dep_marker not in text:
              text += (
                  "\n\ndependencies {\n"
                  "    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.5\")\n"
                  "    implementation(\"com.tencent:mmkv:2.4.2\")\n"
                  "    modules {\n"
                  "        module(\"com.tencent:mmkv-static\") {\n"
                  "            replacedBy(\"com.tencent:mmkv\", \"Using mmkv for Flutter\")\n"
                  "        }\n"
                  "        module(\"com.tencent:mmkv-shared\") {\n"
                  "            replacedBy(\"com.tencent:mmkv\", \"Using mmkv for Flutter\")\n"
                  "        }\n"
                  "    }\n"
                  "}\n"
              )
          app_gradle.write_text(text)

          root_gradle = Path("android/build.gradle.kts")
          root_text = root_gradle.read_text()
          if "https://jitpack.io" not in root_text:
              root_text = root_text.replace(
                  "mavenCentral()",
                  "mavenCentral()\n        maven(url = \"https://jitpack.io\")",
                  1,
              )
          root_gradle.write_text(root_text)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Patch flutter_sing_box Android runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          roots = list(Path.home().glob('.pub-cache/hosted/*/flutter_sing_box-1.2.0'))
          if not roots:
              raise SystemExit('flutter_sing_box 1.2.0 package not found in PUB_CACHE')
          plugin = roots[0]

          gradle = plugin / 'android/build.gradle.kts'
          g = gradle.read_text()
          g = g.replace('compileSdk = 37', 'compileSdk = 36')
          gradle.write_text(g)

          # Add a native MethodChannel handoff. Dart sends the final normalized
          # JSON here; native Android writes it and updates native MMKV so the
          # :remote VPN process always sees the exact runtime config.
          plugin_kt = plugin / 'android/src/main/kotlin/com/clashsing/flutter_sing_box/FlutterSingBoxPlugin.kt'
          p = plugin_kt.read_text()
          if 'import com.tencent.mmkv.MMKV' not in p:
              p = p.replace(
                  'import com.clashsing.flutter_sing_box.cs.SingBoxConnector\n',
                  'import com.clashsing.flutter_sing_box.cs.SingBoxConnector\nimport com.tencent.mmkv.MMKV\nimport java.io.File\n',
                  1,
              )

          runtime_case = '''            "setRuntimeConfig" -> {
                try {
                    if (call.arguments !is Map<*, *>) {
                        result.error("INVALID_ARGUMENTS", "runtime config arguments missing", null)
                        return
                    }
                    val args = call.arguments as Map<*, *>
                    val content = args["content"] as String?
                    if (content.isNullOrBlank()) {
                        result.error("INVALID_CONFIG", "runtime config is empty", null)
                        return
                    }
                    val runtimeDir = File(PluginManager.appContext.filesDir, "cybermatrix_runtime")
                    runtimeDir.mkdirs()
                    val runtimeFile = File(runtimeDir, "using_config.json")
                    runtimeFile.writeText(content)
                    val profileKv = MMKV.mmkvWithID("cs_profile", MMKV.MULTI_PROCESS_MODE)
                    profileKv.encode("using_config", runtimeDir.absolutePath)
                    profileKv.sync()
                    result.success(runtimeFile.absolutePath)
                } catch (e: Exception) {
                    result.error("RUNTIME_CONFIG_ERROR", e.message, e)
                }
            }
'''
          if '"setRuntimeConfig" -> {' not in p:
              marker = '            "startVpn" -> {\n'
              if marker not in p:
                  raise SystemExit('startVpn case not found in FlutterSingBoxPlugin.kt')
              p = p.replace(marker, runtime_case + marker, 1)
          plugin_kt.write_text(p)

          # The upstream service used only using_config.json and rejected the
          # start if the selected Profile object was unavailable. Make startup
          # resilient: use runtime config first, then fall back to profile.path,
          # and do not require profile metadata just to start the tunnel.
          box = plugin / 'android/src/main/kotlin/io/nekohasekai/sfa/bg/BoxService.kt'
          b = box.read_text()
          old = '''            val configFile = ProfileManager.getUsingConfig()
            val profile = ProfileManager.getSelectedProfile()
            if (profile == null || !configFile.exists()) {
                stopAndAlert(Alert.EmptyConfiguration)
                return
            }
            val content = configFile.readText()
            if (content.isBlank()) {
                stopAndAlert(Alert.EmptyConfiguration)
                return
            }

            lastProfileName = profile.name
'''
          new = '''            val usingConfigFile = ProfileManager.getUsingConfig()
            val profile = ProfileManager.getSelectedProfile()
            val profileConfigFile = profile?.typed?.path?.let { java.io.File(it) }
            val configFile = when {
                usingConfigFile.exists() && usingConfigFile.length() > 0L -> usingConfigFile
                profileConfigFile != null && profileConfigFile.exists() && profileConfigFile.length() > 0L -> profileConfigFile
                else -> null
            }
            if (configFile == null) {
                stopAndAlert(Alert.EmptyConfiguration, "CyberMatrix: runtime/profile config file not found")
                return
            }
            val content = configFile.readText()
            if (content.isBlank()) {
                stopAndAlert(Alert.EmptyConfiguration, "CyberMatrix: runtime config is blank: ${configFile.path}")
                return
            }

            lastProfileName = profile?.name ?: "CyberMatrix Tunnel"
'''
          count = b.count(old)
          if count == 0:
              raise SystemExit('BoxService config block not found')
          b = b.replace(old, new)
          box.write_text(b)
          print(f'Patched {count} BoxService config blocks')

          # Upstream sends service alerts only to Android logs. Mirror them into
          # Flutter's log EventChannel so the app shows the actual startup error.
          connector = plugin / 'android/src/main/kotlin/com/clashsing/flutter_sing_box/cs/SingBoxConnector.kt'
          c = connector.read_text()
          old_alert = '''        override fun onServiceAlert(type: Int, message: String?) {
            Log.e(TAG, "onServiceAlert: $type $message")
            proxyStatus = Status.Stopped
'''
          new_alert = '''        override fun onServiceAlert(type: Int, message: String?) {
            Log.e(TAG, "onServiceAlert: $type $message")
            val alertText = "VPN_ALERT: ${message ?: "service alert type=$type"}"
            coroutineScope?.launch(Dispatchers.Main.immediate) {
                logSink?.success(Json.encodeToString(listOf(ClientLog(2, alertText))))
            }
            proxyStatus = Status.Stopped
'''
          if old_alert not in c:
              raise SystemExit('onServiceAlert block not found')
          c = c.replace(old_alert, new_alert, 1)
          connector.write_text(c)

          print('flutter_sing_box Android runtime patched successfully')
          PY

      - name: Analyze Dart
        run: flutter analyze

      - name: Validate Android configuration
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:processReleaseMainManifest --stacktrace
          ./gradlew :app:checkReleaseAarMetadata --stacktrace

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybermatrix-tunnel-v1.1.2-vpn-fix
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
