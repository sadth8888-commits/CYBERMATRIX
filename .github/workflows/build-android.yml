name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Generate Android project and native app wiring
        run: |
          flutter create --platforms=android --org ir.cybermatrix --project-name cybermatrix_tunnel .
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          android_ns = 'http://schemas.android.com/apk/res/android'
          ET.register_namespace('android', android_ns)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          tree = ET.parse(manifest)
          root = tree.getroot()
          application = root.find('application')
          if application is None:
              raise RuntimeError('application node not found in AndroidManifest.xml')

          application.set(f'{{{android_ns}}}label', 'سایبرماتریکس تونل')
          application.set(f'{{{android_ns}}}name', '.MyApplication')
          application.set(f'{{{android_ns}}}usesCleartextTraffic', 'true')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)

          # Verify the manifest is still valid XML before Gradle runs.
          ET.parse(manifest)
          print(manifest.read_text())

          app = Path('android/app/src/main/kotlin/ir/cybermatrix/cybermatrix_tunnel/MyApplication.kt')
          app.parent.mkdir(parents=True, exist_ok=True)
          app.write_text('''package ir.cybermatrix.cybermatrix_tunnel

          import android.app.Application
          import com.tencent.mmkv.MMKV

          class MyApplication : Application() {
              override fun onCreate() {
                  super.onCreate()
                  MMKV.initialize(this)
              }
          }
          ''')

          app_gradle = Path('android/app/build.gradle.kts')
          text = app_gradle.read_text()
          text = text.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
          text = text.replace(
              'sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17',
              'sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n        isCoreLibraryDesugaringEnabled = true',
          )
          if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' not in text:
              text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")\n}\n'
          app_gradle.write_text(text)

          root_gradle = Path('android/build.gradle.kts')
          text = root_gradle.read_text()
          if 'https://jitpack.io' not in text:
              text = text.replace('mavenCentral()', 'mavenCentral()\n        maven(url = "https://jitpack.io")', 1)
          root_gradle.write_text(text)
          PY

      - name: Get packages
        run: flutter pub get

      - name: Patch flutter_sing_box for SDK 36
        run: |
          PLUGIN_GRADLE=$(find "$PUB_CACHE/hosted" -path '*/flutter_sing_box-1.2.0/android/build.gradle.kts' | head -n 1)
          if [ -z "$PLUGIN_GRADLE" ]; then
            echo "flutter_sing_box 1.2.0 Gradle file not found"
            exit 1
          fi
          echo "Patching $PLUGIN_GRADLE"
          sed -i 's/compileSdk = 37/compileSdk = 36/' "$PLUGIN_GRADLE"
          grep -n 'compileSdk\|libbox' "$PLUGIN_GRADLE"

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cybermatrix-tunnel-real-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
